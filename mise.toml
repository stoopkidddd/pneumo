[tools]
node = "26"
pnpm = "11.28.10"
java = "temurin-17"

[env]
_.file = { path = ".env.local", redact = true }
ANDROID_HOME = "{{env.HOME}}/Library/Android/sdk"

[tasks.check]
description = "Run every lane check"
depends = ["check:android"]

[tasks."android:setup"]
description = "Write the ignored Android SDK location"
dir = "apps/android"
run = "./scripts/setup.sh"

[tasks."check:android"]
description = "Check Android formatting, analysis, lint, JVM tests and screenshots"
dir = "apps/android"
run = "./gradlew spotlessCheck detekt lint testDebugUnitTest verifyRoborazziDebug"

[tasks."e2e:android"]
description = "Run the Pixel 6 API 34 managed-device smoke test"
dir = "apps/android"
run = "./gradlew pixel6Api34DebugAndroidTest"
