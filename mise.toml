[tools]
node = "26"
pnpm = "11.28.10"
java = "temurin-17"

[env]
_.file = { path = ".env.local", redact = true }
ANDROID_HOME = "{{env.HOME}}/Library/Android/sdk"

[tasks.check]
description = "Run every lane check"
depends = ["check:protocol", "check:server", "check:web", "check:android", "check:brand", "check:infra"]

[tasks."check:protocol"]
description = "Check protocol and crypto formatting, lint, types and tests"
run = [
  "pnpm exec biome check --error-on-warnings package.json pnpm-workspace.yaml tsconfig.base.json biome.json vitest.config.ts packages/protocol packages/crypto",
  "pnpm --filter @pneumo/protocol --filter @pneumo/crypto run typecheck",
  "pnpm exec vitest run --project @pneumo/protocol --project @pneumo/crypto",
]

[tasks."check:server"]
description = "Check server formatting, lint, types and tests"
run = [
  "pnpm exec biome check --error-on-warnings apps/server",
  "pnpm --filter @pneumo/server run typecheck",
  "pnpm exec vitest run --project @pneumo/server",
]

[tasks."check:web"]
description = "Check web formatting, lint, types, tests and production build"
run = [
  "pnpm exec biome check --error-on-warnings apps/web",
  "pnpm --filter @pneumo/web run typecheck",
  "pnpm exec vitest run --project @pneumo/web",
  "pnpm --filter @pneumo/web run build",
]

[tasks.fmt]
description = "Format TypeScript packages and root configuration"
run = "pnpm exec biome format --write ."

[tasks."android:setup"]
description = "Write the ignored Android SDK location"
dir = "apps/android"
run = "./scripts/setup.sh"

[tasks."check:android"]
description = "Check Android formatting, analysis, lint, JVM tests and screenshots"
dir = "apps/android"
run = "./gradlew spotlessCheck detekt lint testDebugUnitTest verifyRoborazziDebug"

[tasks."e2e:android"]
description = "Run the Pixel 6 API 34 managed-device smoke test"
dir = "apps/android"
run = "./gradlew pixel6Api34DebugAndroidTest"

[tasks."brand:export"]
description = "Export deterministic brand assets and design tokens"
run = "pnpm exec node scripts/brand-export.mjs"

[tasks."check:brand"]
description = "Validate brand sources, contrast and reproducible generated assets"
run = [
  "pnpm exec biome check --error-on-warnings scripts/brand-export.mjs brand/tokens.json brand/tokens.schema.json",
  "pnpm exec node scripts/brand-export.mjs --check",
]

[tasks."dev:infra"]
description = "Start persistent local MinIO and create the development bucket"
run = "docker compose up -d minio minio-init"

[tasks."dev:server"]
description = "Run the server dev script when available"
depends = ["dev:infra"]
run = "pnpm --filter @pneumo/server --if-present run dev"

[tasks."dev:web"]
description = "Run the web dev script when available"
depends = ["dev:infra"]
run = "pnpm --filter @pneumo/web --if-present run dev"

[tasks.dev]
description = "Start local infrastructure, then server and web in parallel"
depends = ["dev:server", "dev:web"]

[tasks."check:infra"]
description = "Validate Compose, shell scripts and infrastructure TypeScript"
run = [
  "docker compose config -q",
  "find scripts -type f -name '*.sh' -exec shellcheck {} +",
  "pnpm exec biome check --error-on-warnings scripts/",
  "pnpm exec tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --types node scripts/e2e/minio.ts",
]
